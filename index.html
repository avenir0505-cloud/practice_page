<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>티켓팅 연습</title>
<style>
* {
  box-sizing: border-box;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
body {
  font-family: sans-serif;
  text-align: center;
  padding: 24px 16px 40px;
  margin: 0;
  background: #f8fafc;
  color: #000;
}
h2 { font-size: 22px; margin: 0 0 12px; }

/* 닉네임 / 대기 / 시작 버튼 한 줄 */
.row {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: nowrap;
  gap: 5px;
  max-width: 460px;
  margin: 0 auto;
  font-size: 13px;
  color: #333;
}
.row label { white-space: nowrap; }
.row input, .row select {
  font-size: 15px;
  padding: 8px 6px;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  min-width: 0;
}
.row input { flex: 1 1 auto; width: 70px; -webkit-user-select: text; user-select: text; }
.row select { flex: 0 0 auto; }
.row input:disabled, .row select:disabled { background: #e5e7eb; color: #6b7280; }
#startBtn {
  flex: 0 0 auto;
  white-space: nowrap;
  padding: 0 10px;
  min-height: 40px;
  font-size: 15px;
  font-weight: bold;
  border-radius: 8px;
  background: #2563eb;
  color: #fff;
}
#startBtn:disabled { background: #cbd5e1; color: #777; }

.nouse { -webkit-user-select: none; user-select: none; }
#status {
  font-size: 36px; font-weight: bold; margin: 12px 0;
  min-height: 90px; display: flex; align-items: center; justify-content: center;
}
#status.idle { font-size: clamp(14px, 4.8vw, 24px); white-space: nowrap; }
button { border: 0; border-radius: 14px; cursor: pointer; font-size: 20px; }
#popupBtn {
  width: 100%; max-width: 460px; min-height: 110px;
  font-size: 30px; font-weight: bold;
  background: #ccc; color: #777;
}
#popupBtn.ready { background: #16a34a; color: #fff; }
#popupBtn.early { background: #dc2626; color: #fff; }
#msg { min-height: 26px; margin: 14px 0 6px; font-size: 17px; color: #dc2626; font-weight: bold; }
.box {
  max-width: 460px; margin: 14px auto 0; padding: 14px;
  background: #fff; border-radius: 12px; font-size: 16px; text-align: left;
}
.box h3 { margin: 0 0 8px; font-size: 17px; }
.box ol { margin: 0; padding-left: 24px; }
.box li { padding: 2px 0; }
.box .me { font-weight: bold; color: #2563eb; }
#boardMsg { font-size: 14px; color: #b45309; margin-top: 8px; }
#resetBtn { margin-top: 10px; padding: 10px 16px; font-size: 14px; background: #e2e8f0; color: #333; }
#popupLayer {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.6);
  justify-content: center; align-items: center;
  padding: 20px; z-index: 1000;
}
.popup { background: white; width: 100%; max-width: 500px; padding: 30px 20px; border-radius: 16px; }
#elapsed { font-size: clamp(32px, 9vw, 46px); font-weight: bold; color: #2563eb; margin: 24px 0 8px; word-break: keep-all; }
#detail { font-size: 15px; color: #444; margin-bottom: 24px; }
#closeBtn { width: 100%; min-height: 72px; font-size: 24px; background: #2563eb; color: #fff; }
</style>
<!-- Firebase 설정값은 별도 파일(firebase-config.js)에서 불러옵니다 -->
<script src="firebase-config.js"></script>
</head>
<body>
<h2>티켓팅 연습</h2>

<div class="row">
  <label for="nameInput">닉네임</label>
  <input id="nameInput" maxlength="10" placeholder="익명" autocomplete="off">
  <label for="secSel">대기</label>
  <select id="secSel">
    <option value="5">5초</option>
    <option value="10">10초</option>
    <option value="15" selected>15초</option>
    <option value="30">30초</option>
  </select>
  <button id="startBtn">시작</button>
</div>

<div class="nouse">
  <div id="status" class="idle">이름 입력 후 시작 버튼을 누르세요</div>
  <button id="popupBtn">팝업 열기</button>
</div>
<div id="msg"></div>

<div class="box">
  <h3>내 기록 (이번 접속)</h3>
  <div id="sum">기록 없음</div>
  <button id="resetBtn">내 기록 초기화</button>
</div>

<div class="box">
  <h3>🏆 전체 순위 TOP 10</h3>
  <ol id="topList"></ol>
</div>

<div class="box">
  <h3>🕒 최근 기록 10개</h3>
  <ol id="recentList"></ol>
  <div id="boardMsg"></div>
</div>

<div id="popupLayer" role="dialog" aria-modal="true" aria-labelledby="popupTitle">
  <div class="popup">
    <h2 id="popupTitle">총 경과 시간</h2>
    <div id="elapsed">계산 중...</div>
    <div id="detail"></div>
    <button id="closeBtn">닫기</button>
  </div>
</div>

<script>
const cfg = (typeof firebaseConfig !== "undefined") ? firebaseConfig : null;

const btn = document.getElementById("popupBtn");
const startBtn = document.getElementById("startBtn");
const statusEl = document.getElementById("status");
const msgEl = document.getElementById("msg");
const popupLayer = document.getElementById("popupLayer");
const elapsedElement = document.getElementById("elapsed");
const detailEl = document.getElementById("detail");
const closeBtn = document.getElementById("closeBtn");
const secSel = document.getElementById("secSel");
const sumEl = document.getElementById("sum");
const resetBtn = document.getElementById("resetBtn");
const nameInput = document.getElementById("nameInput");
const topList = document.getElementById("topList");
const recentList = document.getElementById("recentList");
const boardMsg = document.getElementById("boardMsg");

let timer = null;
let phase = "idle";      // idle(대기) → counting(카운트다운) → ready(활성) → done(팝업)
let activationTime = 0;
let earlyCount = 0;
let hasPlayed = false;
let records = [];

/* ---------- 닉네임 (새로고침해도, 다음 시도에서도 유지) ---------- */
try { nameInput.value = localStorage.getItem("ticketing_name") || ""; } catch (e) {}
nameInput.addEventListener("input", () => {
  try { localStorage.setItem("ticketing_name", nameInput.value); } catch (e) {}
});
function getName() {
  return nameInput.value.trim().slice(0, 10) || "익명";
}

/* ---------- Firebase (실패해도 연습은 가능) ---------- */
let db = null;
let fs = null;

function renderBoard(ol, snap) {
  ol.innerHTML = "";
  if (snap.empty) {
    const li = document.createElement("li");
    li.textContent = "아직 기록이 없어요";
    ol.appendChild(li);
    return;
  }
  snap.forEach((doc) => {
    const d = doc.data();
    const li = document.createElement("li");
    li.textContent = d.name + "  " + (d.ms / 1000).toFixed(3) + "초";
    if (d.name === getName()) li.className = "me";
    ol.appendChild(li);
  });
}

async function initFirebase() {
  if (!cfg || !cfg.apiKey || cfg.apiKey.startsWith("YOUR_")) {
    boardMsg.textContent = "firebase-config.js에 Firebase 설정값이 아직 없어서 기록이 공유되지 않아요.";
    return;
  }
  try {
    const V = "10.12.2";
    const [appMod, fsMod] = await Promise.all([
      import("https://www.gstatic.com/firebasejs/" + V + "/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/" + V + "/firebase-firestore.js")
    ]);
    const app = appMod.initializeApp(cfg);
    db = fsMod.getFirestore(app);
    fs = fsMod;
    const col = fs.collection(db, "records");

    fs.onSnapshot(
      fs.query(col, fs.orderBy("ms", "asc"), fs.limit(10)),
      (snap) => renderBoard(topList, snap),
      (err) => { boardMsg.textContent = "순위 불러오기 실패: " + err.code; }
    );
    fs.onSnapshot(
      fs.query(col, fs.orderBy("createdAt", "desc"), fs.limit(10)),
      (snap) => renderBoard(recentList, snap),
      (err) => { boardMsg.textContent = "최근 기록 불러오기 실패: " + err.code; }
    );
  } catch (e) {
    boardMsg.textContent = "Firebase 연결 실패: " + e.message;
  }
}

async function saveRecord(ms) {
  if (!db) return;
  try {
    await fs.addDoc(fs.collection(db, "records"), {
      name: getName(),
      ms: Math.round(ms),
      createdAt: fs.serverTimestamp()
    });
    boardMsg.textContent = "";
  } catch (e) {
    boardMsg.textContent = "기록 저장 실패: " + (e.code || e.message);
  }
}

/* ---------- 상태 전환 ---------- */
function setIdle() {
  clearInterval(timer);
  timer = null;
  phase = "idle";
  earlyCount = 0;
  btn.className = "";
  msgEl.textContent = "";
  statusEl.className = "idle";
  statusEl.textContent = "이름 입력 후 시작 버튼을 누르세요";
  startBtn.textContent = hasPlayed ? "다시 시작" : "시작";
  startBtn.disabled = false;
  nameInput.disabled = false;   // 대기 중에는 이름 수정/삭제 가능
  secSel.disabled = false;
}

function startCountdown(seconds) {
  clearInterval(timer);
  phase = "counting";
  earlyCount = 0;
  msgEl.textContent = "";
  btn.className = "";
  statusEl.className = "";
  startBtn.disabled = true;
  nameInput.disabled = true;
  secSel.disabled = true;
  nameInput.blur();             // 키보드 닫기

  const endTime = performance.now() + seconds * 1000;

  function update() {
    const remaining = Math.max(0, endTime - performance.now());
    statusEl.textContent = (remaining / 1000).toFixed(3) + "초";
    if (remaining <= 0) {
      clearInterval(timer);
      timer = null;
      phase = "ready";
      activationTime = performance.now();
      btn.className = "ready";
      statusEl.textContent = "지금 누르세요!";
    }
  }
  update();
  timer = setInterval(update, 10);
}

function renderMine() {
  if (records.length === 0) { sumEl.textContent = "기록 없음"; return; }
  const best = Math.min(...records);
  const avg = records.reduce((a, b) => a + b, 0) / records.length;
  sumEl.textContent = "최고 " + (best / 1000).toFixed(3) + "초 · 평균 " +
    (avg / 1000).toFixed(3) + "초 · " + records.length + "회";
}

function handlePress() {
  if (phase === "idle") {
    msgEl.textContent = "시작 버튼을 먼저 누르세요";
    return;
  }
  if (phase === "counting") {
    earlyCount++;
    btn.classList.add("early");
    msgEl.textContent = "너무 일찍 눌렀어요! (" + earlyCount + "회)";
    setTimeout(() => btn.classList.remove("early"), 150);
    return;
  }
  if (phase !== "ready") return;

  const clickTime = performance.now();
  const reaction = clickTime - activationTime;
  phase = "done";
  hasPlayed = true;
  btn.className = "";

  popupLayer.style.display = "flex";
  elapsedElement.textContent = "계산 중...";
  detailEl.textContent = "";

  requestAnimationFrame(() => {
    const popupMs = performance.now() - clickTime;
    elapsedElement.textContent = ((reaction + popupMs) / 1000).toFixed(3) + "초";
    detailEl.textContent =
      "누르기까지 " + (reaction / 1000).toFixed(3) + "초 + 팝업 표시 " + popupMs.toFixed(0) + "ms" +
      (earlyCount ? " · 일찍 누름 " + earlyCount + "회" : "");
  });

  records.push(reaction);
  renderMine();
  saveRecord(reaction);
}

btn.addEventListener("pointerdown", (e) => { e.preventDefault(); handlePress(); });
btn.addEventListener("click", (e) => { if (e.detail === 0) handlePress(); });

startBtn.addEventListener("click", () => {
  if (phase === "idle") startCountdown(Number(secSel.value));
});

closeBtn.addEventListener("click", () => {
  popupLayer.style.display = "none";
  setIdle();
});

resetBtn.addEventListener("click", () => { records = []; renderMine(); });

setIdle();
initFirebase();
</script>
</body>
</html>
